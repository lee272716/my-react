name: 前端自动打包
on: push # 推送事件

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 安装node
        uses: actions/setup-node@v4
        with:
          node-versions: '18'
          cache: 'npm'
      
      - name: 安装依赖
        run: npm install

      - name: 打包
        run: npm run build
